# Replace SERVER_IP before installation. Application accounts use secure cookies.
map $request_method $repromind_write_key {
    default $binary_remote_addr;
    GET "";
    HEAD "";
    OPTIONS "";
}
limit_req_zone $repromind_write_key zone=repromind_writes:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=repromind_connections:10m;

server {
    listen 80;
    server_name SERVER_IP;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name SERVER_IP;
    ssl_certificate /etc/letsencrypt/live/SERVER_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_IP/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 45m;
    client_body_timeout 60s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    root /opt/repromind/frontend/dist;

    location /api/ {
        limit_req zone=repromind_writes burst=20 nodelay;
        limit_req_status 429;
        limit_conn repromind_connections 8;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /assets/ { try_files $uri =404; expires 7d; }
    location ~* ^/(?!api/).*\.(pdf|zip)$ { try_files $uri =404; }
    location ~ (^|/)\. { return 404; }
    location ~ \.(py|toml|md|env|db|sqlite|log|ya?ml)$ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
